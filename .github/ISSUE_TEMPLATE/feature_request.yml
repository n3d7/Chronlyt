name: Feature request
description: Suggest an improvement grounded in a user problem.
title: "feat: "
labels: [enhancement]
body:
  - type: dropdown
    id: scope
    attributes:
      {
        label: Scope,
        description: Plugin ideas and plugin-specific work may belong in https://github.com/n3d7/Chronlyt-Plugins.,
        options: [Chronlyt base application, Plugin or plugin system, Unsure],
      }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: Problem, description: "What is difficult today?" }
    validations: { required: true }
  - type: textarea
    id: behaviour
    attributes: { label: Desired behaviour }
    validations: { required: true }
  - type: textarea
    id: use_case
    attributes: { label: Use case }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
