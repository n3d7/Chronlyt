name: Feature request
description: Suggest an improvement grounded in a user problem.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What is difficult today? }
    validations: { required: true }
  - type: textarea
    id: behaviour
    attributes: { label: Desired behaviour }
    validations: { required: true }
  - type: textarea
    id: use_case
    attributes: { label: Use case }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
