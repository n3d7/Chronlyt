name: Landing page

on:
  push:
    branches: [main]
    paths:
      [
        "site/**",
        "docs/assets/screenshots/**",
        "docs/assets/brand/**",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          mkdir -p site/assets
          cp docs/assets/screenshots/dashboard-dark.png site/assets/dashboard-dark.png
          cp docs/assets/brand/logo-mark.svg site/assets/logo-mark.svg
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v5
